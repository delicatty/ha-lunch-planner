name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a change in Home Assistant's rules shows up without a commit.
    - cron: "0 6 * * 1"

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS / Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The integration is not listed in home-assistant/brands.
          ignore: brands

  pytest:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Install the Home Assistant frontend (the panel tests serve it)
        # Read the manifest as a file: importing an integration could need
        # requirements that are not installed yet.
        run: |
          python - <<'PY' > frontend-requirements.txt
          import importlib.util, json, pathlib
          components = pathlib.Path(importlib.util.find_spec("homeassistant").origin).parent / "components"
          manifest = components / "frontend" / "manifest.json"
          print("\n".join(json.loads(manifest.read_text())["requirements"]))
          PY
          pip install -r frontend-requirements.txt
      - name: Run tests
        run: pytest
