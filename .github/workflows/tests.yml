name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Install the Home Assistant frontend (the panel tests serve it)
        run: |
          python - <<'PY' > frontend-requirements.txt
          import json, pathlib, homeassistant.components.frontend as frontend
          manifest = pathlib.Path(frontend.__file__).parent / "manifest.json"
          print("\n".join(json.loads(manifest.read_text())["requirements"]))
          PY
          pip install -r frontend-requirements.txt
      - name: Run tests
        run: pytest
