name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a change in Home Assistant's rules shows up without a commit.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS / Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The integration is not listed in home-assistant/brands.
          ignore: brands
