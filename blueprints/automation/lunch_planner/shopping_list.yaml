blueprint:
  name: Lunch Planner – shopping list
  description: >-
    On a shopping day, sends what to buy for the next lunch(es) to a phone and
    adds it to to-do lists. The Lunch Planner integration decides which days
    are shopping days (e.g. Monday's lunch is bought on Saturday when shops are
    closed on Sunday). When a lunch is bought in the morning of its day (after
    a long break, e.g. Easter), the list is sent the evening before.
    Optionally, when a person is at work at the set time, the list is sent as
    they leave work, so they can shop on the way home. When a lunch on the
    list changes after it was sent (sides swapped or drawn again before
    18:00), the list is sent again.
  domain: automation
  author: delicatty
  source_url: https://github.com/delicatty/ha-lunch-planner/blob/main/blueprints/automation/lunch_planner/shopping_list.yaml
  homeassistant:
    min_version: "2025.6.0"
  input:
    planner:
      name: Planner
      icon: mdi:silverware-fork-knife
      input:
        to_buy_sensor:
          name: '"To buy" sensor'
          description: The planner's "To buy" sensor.
          selector:
            entity:
              integration: lunch_planner
              domain: sensor
        time:
          name: Time
          description: >-
            When to send the list on a shopping day (or the evening before
            shopping in the morning).
          default: "17:00:00"
          selector:
            time:
    delivery:
      name: Delivery
      icon: mdi:cellphone-message
      input:
        notify_device:
          name: Phone
          description: A phone with the Home Assistant app.
          selector:
            device:
              integration: mobile_app
        shopping_lists:
          name: Add to to-do lists
          description: The things to buy are added here, unless already on the list.
          default: []
          selector:
            entity:
              domain: todo
              multiple: true
        title:
          name: Notification title
          default: Shopping for lunch
          selector:
            text:
        to_buy_text:
          name: Text before the list
          default: "To buy:"
          selector:
            text:
        morning_text:
          name: Text before the list for tomorrow morning
          description: Used when the shopping is in the morning of the lunch day.
          default: "To buy tomorrow morning:"
          selector:
            text:
    leaving_work:
      name: Leaving work
      icon: mdi:briefcase-outline
      collapsed: true
      input:
        person:
          name: Person
          description: >-
            If this person is in the work zone at the set time, the list is
            sent when they leave it, so they can shop on the way home. Leave
            this or the zone empty to always send at the set time.
          default: ""
          selector:
            entity:
              domain: person
        work_zone:
          name: Work zone
          default: ""
          selector:
            entity:
              domain: zone
        earliest_time:
          name: Earliest time
          description: >-
            Leaving work before this time (e.g. for a lunch break) does not
            send the list. Leaving after it sends the list right away, also
            before the set time.
          default: "15:00:00"
          selector:
            time:
        latest_time:
          name: Latest time
          description: >-
            If the person is still at work at this time, the list is sent
            anyway.
          default: "20:00:00"
          selector:
            time:

mode: single
max_exceeded: silent

trigger_variables:
  person: !input person
  work_zone: !input work_zone

variables:
  sensor: !input to_buy_sensor
  earliest_time: !input earliest_time
  latest_time: !input latest_time
  lists: !input shopping_lists
  title: !input title
  to_buy_text: !input to_buy_text
  morning_text: !input morning_text
  use_work: "{{ person != '' and work_zone != '' }}"
  at_work: "{{ use_work and person in (state_attr(work_zone, 'persons') or []) }}"
  items: "{{ state_attr(sensor, 'shopping_items') or [] }}"
  summary: "{{ state_attr(sensor, 'summary') or '' }}"
  heading: "{{ morning_text if state_attr(sensor, 'shopping_morning') else to_buy_text }}"

triggers:
  - trigger: time
    id: scheduled
    at: !input time
  - alias: The person leaves the work zone
    trigger: template
    id: left_work
    value_template: >-
      {{ person != '' and work_zone != ''
         and person not in (state_attr(work_zone, 'persons') or []) }}
  - trigger: time
    id: latest
    at: !input latest_time
  - alias: A lunch changed after the list was sent
    trigger: event
    id: changed
    event_type: lunch_planner_plan_updated

conditions:
  - alias: The shopping list goes out today
    condition: template
    value_template: >-
      {{ (state_attr(sensor, 'list_date') or state_attr(sensor, 'shopping_date'))
         == now().date().isoformat() }}
  - alias: There is something to buy
    condition: template
    value_template: "{{ items | count > 0 }}"
  - alias: Not sent yet today (sent already, after a change)
    condition: template
    value_template: >-
      {% set sent = this.attributes.last_triggered is not none
         and as_local(this.attributes.last_triggered).date() == now().date() %}
      {{ sent if trigger.id == 'changed' else not sent }}
  - alias: The right moment
    condition: template
    value_template: >-
      {% if trigger.id == 'scheduled' %}
        {{ not at_work }}
      {% elif trigger.id == 'left_work' %}
        {{ today_at(earliest_time) <= now() < today_at(latest_time) }}
      {% elif trigger.id == 'changed' %}
        {% set entry = config_entry_id(sensor) %}
        {{ (entry is none or entry == trigger.event.data.entry_id)
           and trigger.event.data.drawn | select('in', state_attr(sensor, 'meal_dates') or [])
               | list | count > 0 }}
      {% else %}
        {{ use_work }}
      {% endif %}

actions:
  - alias: Notify the phone
    device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "{{ title }}"
    message: |-
      {{ summary }}

      {{ heading }}
      {% for item in items %}• {{ item }}{{ '\n' if not loop.last }}{% endfor %}
    data:
      tag: lunch_planner_shopping
  - alias: Add to the to-do lists
    repeat:
      for_each: "{{ lists }}"
      sequence:
        - variables:
            todo_list: "{{ repeat.item }}"
        - action: todo.get_items
          target:
            entity_id: "{{ todo_list }}"
          data:
            status: needs_action
          response_variable: existing
        - variables:
            missing: >-
              {% set have = existing[todo_list]['items'] | map(attribute='summary') | map('lower') | list %}
              {% set ns = namespace(add=[]) %}
              {% for item in items if item | lower not in have %}
              {% set ns.add = ns.add + [item] %}
              {% endfor %}
              {{ ns.add }}
        - repeat:
            for_each: "{{ missing }}"
            sequence:
              - action: todo.add_item
                target:
                  entity_id: "{{ todo_list }}"
                data:
                  item: "{{ repeat.item }}"
